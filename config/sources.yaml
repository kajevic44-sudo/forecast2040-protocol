# Registry of machine-readable sources.
# Only sources that respond without an API key are listed here. Sources that
# need registration are tracked in the workbook and enabled once a key exists.
#
# id           unique, used as file name in data/raw
# kind         which fetcher to use, must exist in sources/registry.py
# url_template placeholders are filled from params
# cadence      how often the series changes, used to decide refresh policy
# licence      short note on redistribution, needed for the data availability statement

sources:
  - id: worldbank_deu_gdp
    label: Germany, GDP current USD
    kind: worldbank
    url_template: https://api.worldbank.org/v2/country/{country}/indicator/{indicator}
    params:
      country: DEU
      indicator: NY.GDP.MKTP.CD
    cadence: annual
    licence: CC BY 4.0

  - id: worldbank_deu_gdp_pc
    label: Germany, GDP per capita current USD
    kind: worldbank
    url_template: https://api.worldbank.org/v2/country/{country}/indicator/{indicator}
    params:
      country: DEU
      indicator: NY.GDP.PCAP.CD
    cadence: annual
    licence: CC BY 4.0

  - id: worldbank_deu_pop
    label: Germany, population total
    kind: worldbank
    url_template: https://api.worldbank.org/v2/country/{country}/indicator/{indicator}
    params:
      country: DEU
      indicator: SP.POP.TOTL
    cadence: annual
    licence: CC BY 4.0

  - id: eurostat_ip_de
    label: Germany, industrial production index, manufacturing, seasonally adjusted
    kind: eurostat
    url_template: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/{dataset}
    params:
      dataset: sts_inpr_m
      query:
        freq: M
        geo: DE
        nace_r2: C
        s_adj: SCA
        unit: I21
    cadence: monthly
    licence: CC BY 4.0

  - id: eurostat_unemp_de
    label: Germany, unemployment rate, seasonally adjusted
    kind: eurostat
    url_template: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/{dataset}
    params:
      dataset: une_rt_m
      query:
        freq: M
        geo: DE
        s_adj: SA
        age: TOTAL
        sex: T
        unit: PC_ACT
    cadence: monthly
    licence: CC BY 4.0

  # Stooq now serves a JavaScript proof-of-work challenge instead of a CSV.
  # Kept in the registry as documentation of the attempt; disabled for scripts.
  # The same series is available from the Yahoo source below.
  - id: stooq_vw
    label: Volkswagen AG preference share, daily close
    enabled: false
    kind: stooq
    url_template: https://stooq.com/q/d/l/?s={ticker}&i=d
    params:
      ticker: vw
    cadence: daily
    licence: free for private use, verify before publication

  - id: stooq_bmw
    label: BMW AG, daily close
    enabled: false
    kind: stooq
    url_template: https://stooq.com/q/d/l/?s={ticker}&i=d
    params:
      ticker: bmw
    cadence: daily
    licence: free for private use, verify before publication

  - id: yahoo_vow3
    label: Volkswagen AG preference share, Yahoo chart, ten years
    kind: yahoo
    url_template: https://query1.finance.yahoo.com/v8/finance/chart/{ticker}
    params:
      ticker: VOW3.DE
      range: 10y
      interval: 1d
    cadence: daily
    licence: Yahoo terms, research use

  - id: yahoo_tsla
    label: Tesla Inc, Yahoo chart, ten years
    kind: yahoo
    url_template: https://query1.finance.yahoo.com/v8/finance/chart/{ticker}
    params:
      ticker: TSLA
      range: 10y
      interval: 1d
    cadence: daily
    licence: Yahoo terms, research use
